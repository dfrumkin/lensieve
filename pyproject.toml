[project]
name = "lensieve"
version = "0.1.0"
description = "Private AI photo search and curation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Dmitry Frumkin" }
]
dependencies = [
    "accelerate>=1.13.0",
    "duckdb>=1.5.2",
    "exifread>=3.5.1",
    "gradio>=6.13.0",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "jupyterlab-widgets>=3.0.16",
    "lancedb>=0.30.2",
    "nbdime>=4.0.4",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "pyarrow>=24.0.0",
    "rawpy>=0.26.1",
    "ruff>=0.15.12",
    "safetensors>=0.7.0",
    "torch~=2.10.0",
    "transformers>=5.7.0",
]

[project.scripts]
lensieve = "lensieve.app:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
python-preference = "managed"

[tool.ruff]
include = ["**/*.py"]
extend-exclude = []

target-version = "py313"
line-length = 120
respect-gitignore = true

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
ignore = ["F722"] # jaxtyping annotations
extend-select = [
  "E", "F",       # Pyflakes/pycodestyle basics
  "I",            # Import sorting (isort)
  "UP",           # pyupgrade
  "B",            # flake8-bugbear
  "SIM",          # flake8-simplify
  "W",            # pycodestyle warnings
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
